<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    
    <div class="container">

        <!-- Start Screen -->
        <div class="screen active" id="start-screen">
            <h1>Quiz Time!</h1>
            <p>Test Your knowledge with these fun questions</p>
            <button id="start-btn">Start Quiz</button>
        </div>

        <!-- Quiz Screen -->
        <div class="screen " id="quiz-screen">
            <div class="quiz-header">
                <h2 id="question-text">Question goes here.</h2>
                <div class="quiz-info">
                    <p>
                        Qestion <span id="current-question">1</span> of <span id="total-question" class="total"></span>
                    </p>
                    <p>
                        Score: <span id="score"></span>
                    </p>
                </div>
            </div>

            <div id="answer-container">
                <!-- Answers buttons will be inserted from our js code later at some point-->
            </div>
            <div class="progress-bar">
                <div class="progress" id="progress">
                </div>
            </div>
        </div>

        <!-- Result Screen -->
        <div class="screen" id="result-screen">
            <h1>Quiz Result</h1>
            <div class="result-info">
                <p>
                    You scored <span id="final-score">0</span> out of <span id="max-score">5</span>
                </p>
                <div class="result-message">Good effort! Keep learning!</div>
            </div>            
            <button class="restart-quiz" id="restart-btn">Restart Quiz</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
